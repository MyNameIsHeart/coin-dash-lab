<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coin Dash — Lab 3 starter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header><p>LAB 3 · STARTER GAME</p><h1>Coin Dash</h1>
  <p>Grab every yellow coin you can and stay clear of the red drones. Each level gives you 20 seconds.</p></header>
  <div id="game" aria-label="Coin Dash game. Move with arrow keys or WASD."></div>
  <p>Move: <strong>arrow keys / WASD</strong> · Restart: <strong>R</strong> · Pause: <strong>P</strong></p>
</main>
<!-- High score: name prompt shown only when a round sets a new best. -->
<div id="name-overlay" hidden>
  <form id="name-form" autocomplete="off">
    <p id="name-title">New high score!</p>
    <label for="name-input">Who holds it? Enter your name</label>
    <input id="name-input" type="text" maxlength="20" placeholder="Anonymous">
    <button type="submit">Save</button>
  </form>
</div>
<script src="vendor/phaser-3.90.0.min.js"></script>
<script src="settings.js"></script><script src="game.js"></script>
</body>
</html>
